
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReuseMart - Buy & Sell Used Products</title>

    <style>
        /* GENERAL STYLING */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #ffffff;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 10px #ddd;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            color: #4f46e5;
            font-size: 26px;
            font-weight: bold;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 6px;
            padding: 11px 17px;
            font-weight: bold;
        }

        .sell-btn {
            background: #4f46e5;
            color: white;
        }

        .sell-btn:hover {
            background: #3730a3;
        }

        /* HERO SECTION */
        .hero {
            background: linear-gradient(120deg, #4f46e5, #8b5cf6);
            color: white;
            text-align: center;
            padding: 55px 20px;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 14px;
        }

        .hero p {
            font-size: 17px;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            max-width: 650px;
            margin: auto;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        .search-box input {
            flex: 1;
            padding: 15px;
            border: none;
            outline: none;
            min-width: 0;
            font-size: 15px;
        }

        .search-box button {
            background: #f59e0b;
            color: #222;
            border-radius: 0;
        }

        /* MAIN CONTENT */
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 35px 20px;
        }

        .section-title {
            font-size: 27px;
            margin-bottom: 20px;
        }

        .categories {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .category-btn {
            background: white;
            color: #444;
            border: 1px solid #ddd;
            border-radius: 22px;
        }

        .category-btn.active,
        .category-btn:hover {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        .products-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
        }

        /* PRODUCT CARDS */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px #00000010;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image {
            height: 180px;
            background: linear-gradient(135deg, #e0e7ff, #f3e8ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 75px;
            position: relative;
        }

        .used-label {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #dcfce7;
            color: #166534;
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .product-details {
            padding: 18px;
        }

        .product-details h3 {
            font-size: 19px;
            margin-bottom: 9px;
        }

        .price {
            color: #4f46e5;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .product-meta {
            color: #777;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .description {
            color: #555;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .contact-btn {
            flex: 1;
            background: #4f46e5;
            color: white;
        }

        .favorite-btn {
            background: #f3f4f6;
            color: #333;
            font-size: 17px;
        }

        .favorite-btn.selected {
            color: #e11d48;
        }

        .empty-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #666;
            background: white;
            border-radius: 10px;
        }

        /* SELL PRODUCT FORM */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: #00000080;
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px;
            border-radius: 12px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: #eee;
            font-size: 20px;
            padding: 5px 11px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
        }

        .submit-btn {
            background: #4f46e5;
            color: white;
            width: 100%;
            font-size: 16px;
            padding: 13px;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 25px 15px;
            background: #1e1b4b;
            color: white;
            margin-top: 30px;
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 850px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            header {
                padding: 15px 4%;
            }

            nav {
                gap: 10px;
            }
        }

        @media (max-width: 560px) {
            header {
                flex-wrap: wrap;
                gap: 12px;
            }

            nav {
                width: 100%;
                justify-content: space-between;
            }

            .hero h1 {
                font-size: 27px;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            .products-header {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo">♻ ReuseMart</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <button class="sell-btn" onclick="openForm()">
                + Sell Product
            </button>
        </nav>
    </header>

    <!-- HERO SECTION -->
    <section class="hero" id="home">
        <h1>Buy Smart. Sell Easy.</h1>
        <p>Find great deals on quality used products near you.</p>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search mobiles, books, furniture..."
                aria-label="Search products"
                oninput="renderProducts()">

            <button onclick="renderProducts()">Search</button>
        </div>
    </section>

    <!-- PRODUCT SECTION -->
    <main class="container" id="products">

        <h2 class="section-title">Explore Categories</h2>

        <div class="categories" id="categoryList"></div>

        <div class="products-header">
            <h2 class="section-title" style="margin-bottom:0">
                Available Products
            </h2>

            <select id="sortSelect" onchange="renderProducts()"
                    aria-label="Sort products">
                <option value="newest">Newest First</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
            </select>
        </div>

        <div class="product-grid" id="productGrid"></div>

    </main>

    <!-- SELL PRODUCT MODAL -->
    <div class="modal" id="sellModal">
        <div class="modal-content">

            <div class="modal-header">
                <h2>Sell Your Product</h2>
                <button class="close-btn" onclick="closeForm()"
                        aria-label="Close form">&times;</button>
            </div>

            <form id="productForm">

                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <input type="text" id="productName"
                           placeholder="Example: Used Laptop" required>
                </div>

                <div class="form-group">
                    <label for="productCategory">Category</label>
                    <select id="productCategory" required>
                        <option value="">Select Category</option>
                        <option>Mobiles</option>
                        <option>Electronics</option>
                        <option>Furniture</option>
                        <option>Books</option>
                        <option>Vehicles</option>
                        <option>Fashion</option>
                        <option>Others</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="productPrice">Price (₹)</label>
                    <input type="number" id="productPrice"
                           min="1" step="1"
                           placeholder="Enter price" required>
                </div>

                <div class="form-group">
                    <label for="productLocation">Location</label>
                    <input type="text" id="productLocation"
                           placeholder="Example: Erode" required>
                </div>

                <div class="form-group">
                    <label for="productDescription">Description</label>
                    <textarea id="productDescription" rows="3"
                              placeholder="Describe your product"
                              required></textarea>
                </div>

                <div class="form-group">
                    <label for="sellerPhone">Seller Phone Number</label>
                    <input type="tel" id="sellerPhone"
                           pattern="[0-9]{10}"
                           maxlength="10"
                           placeholder="Enter 10-digit mobile number"
                           required>
                </div>

                <button class="submit-btn" type="submit">
                    Publish Product
                </button>

            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 ReuseMart | Buy and Sell Used Products</p>
        <p style="margin-top:8px">Give old products a new life!</p>
    </footer>

    <script>
        // PRODUCT DATA
        const initialProducts = [
            {
                id: 1,
                name: "Samsung Smartphone",
                category: "Mobiles",
                price: 6500,
                location: "Erode",
                description: "Good working condition. Charger included.",
                phone: "9876543210",
                emoji: "📱",
                date: 6
            },
            {
                id: 2,
                name: "HP Laptop",
                category: "Electronics",
                price: 18000,
                location: "Coimbatore",
                description: "Used laptop suitable for students.",
                phone: "9876543211",
                emoji: "💻",
                date: 5
            },
            {
                id: 3,
                name: "Study Table",
                category: "Furniture",
                price: 2200,
                location: "Erode",
                description: "Wooden study table in good condition.",
                phone: "9876543212",
                emoji: "🪑",
                date: 4
            },
            {
                id: 4,
                name: "Engineering Books",
                category: "Books",
                price: 500,
                location: "Salem",
                description: "Useful textbooks for college students.",
                phone: "9876543213",
                emoji: "📚",
                date: 3
            },
            {
                id: 5,
                name: "Mountain Bicycle",
                category: "Vehicles",
                price: 3500,
                location: "Tiruppur",
                description: "Used bicycle with good tyres and brakes.",
                phone: "9876543214",
                emoji: "🚲",
                date: 2
            },
            {
                id: 6,
                name: "Travel Backpack",
                category: "Fashion",
                price: 700,
                location: "Erode",
                description: "Spacious backpack in good condition.",
                phone: "9876543215",
                emoji: "🎒",
                date: 1
            }
        ];

        const categoryEmojis = {
            "Mobiles": "📱",
            "Electronics": "💻",
            "Furniture": "🪑",
            "Books": "📚",
            "Vehicles": "🚲",
            "Fashion": "🎒",
            "Others": "📦"
        };

        const categories = [
            "All",
            "Mobiles",
            "Electronics",
            "Furniture",
            "Books",
            "Vehicles",
            "Fashion",
            "Others"
        ];

        let products = loadProducts();
        let selectedCategory = "All";
        let favorites = loadFavorites();

        // LOAD AND SAVE DATA IN THE BROWSER
        function loadProducts() {
            try {
                const saved = localStorage.getItem("reuseMartProducts");
                return saved ? JSON.parse(saved) : initialProducts;
            } catch (error) {
                return initialProducts;
            }
        }

        function saveProducts() {
            try {
                localStorage.setItem(
                    "reuseMartProducts",
                    JSON.stringify(products)
                );
            } catch (error) {
                alert("Unable to save products in this browser.");
            }
        }

        function loadFavorites() {
            try {
                return JSON.parse(
                    localStorage.getItem("reuseMartFavorites") || "[]"
                );
            } catch (error) {
                return [];
            }
        }

        function saveFavorites() {
            localStorage.setItem(
                "reuseMartFavorites",
                JSON.stringify(favorites)
            );
        }

        // DISPLAY CATEGORY BUTTONS
        function renderCategories() {
            const categoryList = document.getElementById("categoryList");

            categoryList.innerHTML = categories.map(category => `
                <button
                    class="category-btn ${selectedCategory === category ? "active" : ""}"
                    onclick="selectCategory('${category}')">
                    ${category === "All" ? "🌟 All" :
                      categoryEmojis[category] + " " + category}
                </button>
            `).join("");
        }

        function selectCategory(category) {
            selectedCategory = category;
            renderCategories();
            renderProducts();
        }

        // DISPLAY PRODUCTS
        function renderProducts() {
            const grid = document.getElementById("productGrid");
            const searchText = document.getElementById("searchInput")
                .value.trim().toLowerCase();
            const sortValue = document.getElementById("sortSelect").value;

            let filtered = products.filter(product => {
                const matchesCategory =
                    selectedCategory === "All" ||
                    product.category === selectedCategory;

                const matchesSearch =
                    product.name.toLowerCase().includes(searchText) ||
                    product.category.toLowerCase().includes(searchText) ||
                    product.location.toLowerCase().includes(searchText) ||
                    product.description.toLowerCase().includes(searchText);

                return matchesCategory && matchesSearch;
            });

            if (sortValue === "low") {
                filtered.sort((a, b) => a.price - b.price);
            } else if (sortValue === "high") {
                filtered.sort((a, b) => b.price - a.price);
            } else {
                filtered.sort((a, b) => b.date - a.date);
            }

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-message">
                        <h3>No products found!</h3>
                        <p style="margin-top:10px">
                            Try another search or category.
                        </p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(product => `
                <div class="product-card">
                    <div class="product-image">
                        <span class="used-label">USED PRODUCT</span>
                        ${categoryEmojis[product.category] || "📦"}
                    </div>

                    <div class="product-details">
                        <h3>${escapeHTML(product.name)}</h3>

                        <p class="price">
                            ₹${Number(product.price).toLocaleString("en-IN")}
                        </p>

                        <p class="product-meta">
                            📍 ${escapeHTML(product.location)}
                            &nbsp; | &nbsp;
                            ${escapeHTML(product.category)}
                        </p>

                        <p class="description">
                            ${escapeHTML(product.description)}
                        </p>

                        <div class="card-actions">
                            <button class="contact-btn"
                                    onclick="contactSeller(${product.id})">
                                Contact Seller
                            </button>

                            <button
                                class="favorite-btn ${favorites.includes(product.id) ? "selected" : ""}"
                                onclick="toggleFavorite(${product.id})"
                                aria-label="Add to favorites"
                                title="Add to favorites">
                                ${favorites.includes(product.id) ? "♥" : "♡"}
                            </button>
                        </div>
                    </div>
                </div>
            `).join("");
        }

        // PROTECT PRODUCT TEXT FROM HTML INJECTION
        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[character]);
        }

        // OPEN AND CLOSE SELL FORM
        function openForm() {
            document.getElementById("sellModal").style.display = "flex";
        }

        function closeForm() {
            document.getElementById("sellModal").style.display = "none";
        }

        // ADD A NEW PRODUCT
        document.getElementById("productForm").addEventListener(
            "submit",
            function(event) {
                event.preventDefault();

                const name = document.getElementById("productName")
                    .value.trim();
                const category = document.getElementById("productCategory")
                    .value;
                const price = Number(
                    document.getElementById("productPrice").value
                );
                const location = document.getElementById("productLocation")
                    .value.trim();
                const description = document.getElementById("productDescription")
                    .value.trim();
                const phone = document.getElementById("sellerPhone")
                    .value.trim();

                if (!name || !category || !location ||
                    !description || !Number.isFinite(price) || price <= 0 ||
                    !/^[0-9]{10}$/.test(phone)) {
                    alert("Please enter valid product details.");
                    return;
                }

                const newProduct = {
                    id: Date.now(),
                    name: name,
                    category: category,
                    price: price,
                    location: location,
                    description: description,
                    phone: phone,
                    emoji: categoryEmojis[category] || "📦",
                    date: Date.now()
                };

                products.unshift(newProduct);
                saveProducts();

                selectedCategory = "All";
                document.getElementById("searchInput").value = "";
                document.getElementById("sortSelect").value = "newest";

                renderCategories();
                renderProducts();

                this.reset();
                closeForm();

                alert("Product published successfully!");
                document.getElementById("products").scrollIntoView({
                    behavior: "smooth"
                });
            }
        );

        // CONTACT SELLER
        function contactSeller(id) {
            const product = products.find(item => item.id === id);

            if (product) {
                const confirmed = confirm(
                    "Product: " + product.name +
                    "\nPrice: ₹" + product.price +
                    "\nSeller phone: " + product.phone +
                    "\n\nDo you want to call the seller?"
                );

                if (confirmed) {
                    window.location.href = "tel:" + product.phone;
                }
            }
        }

        // ADD OR REMOVE FAVORITES
        function toggleFavorite(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(item => item !== id);
            } else {
                favorites.push(id);
            }

            saveFavorites();
            renderProducts();
        }

        // CLOSE FORM WHEN USER CLICKS OUTSIDE IT
        document.getElementById("sellModal").addEventListener(
            "click",
            function(event) {
                if (event.target === this) {
                    closeForm();
                }
            }
        );

        // INITIALIZE APPLICATION
        renderCategories();
        renderProducts();
    </script>

</body>
</html>
